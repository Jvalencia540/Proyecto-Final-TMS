<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Gestión de Préstamos de Equipos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="layout layout--auth">
  <!-- Tarjeta principal de registro -->
  <main class="auth-card">
    <!-- Encabezado institucional -->
    <div class="auth-card__logo">
      <h1>UTP — Gestión de Préstamos</h1>
      <p>Equipos de cómputo · Biblioteca universitaria</p>
    </div>
    <p class="auth-card__subtitle">Cree su cuenta de estudiante con correo institucional</p>

    <!-- Formulario de creacion de cuenta -->
    <form id="register-form">
      <div id="register-error" class="alert alert--error" hidden role="alert"></div>
      <div class="form-group">
        <label for="codigo">Código de estudiante</label>
        <input type="text" id="codigo" name="codigo" class="form-control" placeholder="20231234" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre Apellido Apellido" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="correo">Correo institucional</label>
        <input type="email" id="correo" name="correo" class="form-control" placeholder="nombre.apellido@utp.edu.co" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" minlength="6" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="password-confirm">Confirmar contraseña</label>
        <input type="password" id="password-confirm" name="password-confirm" class="form-control" minlength="6" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn--primary btn--block">Crear cuenta</button>
    </form>

    <!-- Enlace de retorno al login -->
    <p class="auth-links">
      ¿Ya tiene cuenta? <a href="index.html">Iniciar sesión</a>
    </p>
  </main>

  <!-- Pie de pagina informativo -->
  <footer class="footer" style="background: transparent; border: none; margin-top: 2rem;">
    <p>Universidad Tecnológica de Pereira · Tecnología en Desarrollo de Software · 2026</p>
    <p>Juan José Valencia García · Juan Pablo Muñoz Alvarez</p>
  </footer>

  <!-- Scripts base y logica de registro -->
  <script src="js/store.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
